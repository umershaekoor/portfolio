# HTTPS server block
server {
    server_name voncode.de www.voncode.de;

    # Point to your deployment directory
    root /home/root/deployments/portfolio/current;
    index index.html;

    # Angular routing - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    listen 443 ssl default_server; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/voncode.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/voncode.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP to HTTPS redirect
server {
    if ($host = www.voncode.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = voncode.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    server_name voncode.de www.voncode.de;
    return 404; # managed by Certbot
}
