<div class="intro-container">
    <div class="intro-background">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <div class="intro-content">
        <div class="text-content">
            <div class="greeting">
                <div class="typewriter-line">
                    <span *ngFor="let char of greetingChars; let i = index"
                          class="char"
                          [style.animation-delay]="(0.5 + i * 0.12) + 's'">{{ char }}</span>
                </div>
                <div class="typewriter-line-2">{{ 'WELCOME_SUBTITLE' | translate }}</div>
            </div>
            <h1 class="main-title">
                <span class="title-line">Building Digital</span>
                <span class="title-line gradient-text">Experiences</span>
            </h1>
            <p class="role-badge">
                {{ 'INTRO.ROLE' | translate }}
            </p>

            <div class="cta-group">
                <a href="#contact" class="btn btn-primary">
                    {{ 'INTRO.CTA_PRIMARY' | translate }}
                </a>
                <a href="#experience" class="btn btn-secondary">
                    {{ 'INTRO.CTA_JOURNEY' | translate }}
                </a>
            </div>
        </div>
    </div>

    <div class="scroll-indicator">
        <div class="mouse">
            <div class="wheel"></div>
        </div>
        <p>Scroll to explore</p>
    </div>
</div>
