<div class="intro-container">
    <div class="intro-background">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <div class="intro-content">
        <div class="text-content">
            <div class="greeting">{{ 'WELCOME_MESSAGE' | translate }}</div>
            <h1 class="main-title">
                <span class="title-line">Building Digital</span>
                <span class="title-line gradient-text">Experiences</span>
            </h1>
            <p class="role-badge">
                <span class="badge-dot"></span>
                {{ 'INTRO.ROLE' | translate }}
            </p>

            <div class="cta-group">
                <a href="#contact" class="btn btn-primary">
                    {{ 'INTRO.CTA_PRIMARY' | translate }}
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
                <a href="#experience" class="btn btn-secondary">
                    {{ 'INTRO.CTA_JOURNEY' | translate }}
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M2 12h20"></path>
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <div class="scroll-indicator">
        <div class="mouse">
            <div class="wheel"></div>
        </div>
        <p>Scroll to explore</p>
    </div>
</div>
