<div class="contact-container">
  <!-- Contact Info Section -->
  <div class="contact-content" *ngIf="!showForm()">
    <div class="glass-card">
      <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
      </div>
      
      <h2 class="title">{{ 'CONTACT.TITLE' | translate }}</h2>
      <p class="subtitle">{{ 'CONTACT.SUBTITLE' | translate }}</p>
      
      <div class="action-buttons">
        <button class="btn btn-primary" (click)="openForm()">
          {{ 'CONTACT.EMAIL_BUTTON' | translate }}
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
        
        <a href="https://linkedin.com/in/yourprofile" target="_blank" class="btn btn-secondary">
          {{ 'CONTACT.LINKEDIN_BUTTON' | translate }}
        </a>
      </div>
    </div>
  </div>

  <!-- Contact Form Modal -->
  <div class="form-modal" *ngIf="showForm()">
    <div class="form-container">
      <button class="close-button" (click)="closeForm()" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <h2 class="form-title">Send Me a Message</h2>

      <!-- Success State -->
      <div class="success-message" *ngIf="formState() === 'success'">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <h3>Message Sent!</h3>
        <p>Thank you for reaching out. I'll get back to you soon.</p>
      </div>

      <!-- Form -->
      <form class="contact-form" *ngIf="formState() !== 'success'" (ngSubmit)="sendEmail()">
        <div class="form-group">
          <label for="name">Name *</label>
          <input 
            type="text" 
            id="name" 
            [(ngModel)]="formData.name"
            name="name"
            placeholder="Your name"
            required
            [disabled]="formState() === 'sending'">
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="formData.email"
            name="email"
            placeholder="your.email@example.com"
            required
            [disabled]="formState() === 'sending'">
        </div>

        <div class="form-group">
          <label for="subject">Subject *</label>
          <input 
            type="text" 
            id="subject" 
            [(ngModel)]="formData.subject"
            name="subject"
            placeholder="What's this about?"
            required
            [disabled]="formState() === 'sending'">
        </div>

        <div class="form-group">
          <label for="message">Message *</label>
          <textarea 
            id="message" 
            [(ngModel)]="formData.message"
            name="message"
            rows="6"
            placeholder="Your message..."
            required
            [disabled]="formState() === 'sending'"></textarea>
        </div>

        <!-- Error Message -->
        <div class="error-message" *ngIf="formState() === 'error' && errorMessage()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ errorMessage() }}
        </div>

        <div class="form-actions">
          <button 
            type="button" 
            class="btn btn-secondary" 
            (click)="closeForm()"
            [disabled]="formState() === 'sending'">
            Back
          </button>
          <button 
            type="submit" 
            class="btn btn-primary"
            [disabled]="formState() === 'sending'">
            <span *ngIf="formState() !== 'sending'">Send Message</span>
            <span *ngIf="formState() === 'sending'">
              <span class="spinner"></span>
              Sending...
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
