<div class="contact-container">
  <!-- Contact Info Section -->
  <div class="contact-content" *ngIf="!showForm()">
    <div class="glass-card">
      <div class="icon-wrapper">
        <img src="assets/icons/mail.svg" alt="" width="48" height="48">
      </div>

      <h2 class="title">{{ 'CONTACT.TITLE' | translate }}</h2>
      <p class="subtitle">{{ 'CONTACT.SUBTITLE' | translate }}</p>

      <div class="action-buttons">
        <button class="btn btn-primary" (click)="openForm()">
          {{ 'CONTACT.EMAIL_BUTTON' | translate }}
          <img src="assets/icons/arrow-right.svg" alt="" width="20" height="20">
        </button>

        <a href="https://linkedin.com/in/yourprofile" target="_blank" class="btn btn-secondary">
          {{ 'CONTACT.LINKEDIN_BUTTON' | translate }}
        </a>
      </div>
    </div>
  </div>

  <!-- Contact Form Modal -->
  <div class="form-modal" *ngIf="showForm()">
    <div class="form-container">
      <button class="close-button" (click)="closeForm()" type="button">
        <img src="assets/icons/close.svg" alt="" width="24" height="24">
      </button>

      <h2 class="form-title">Send Me a Message</h2>

      <!-- Success State -->
      <div class="success-message" *ngIf="formState() === 'success'">
        <img src="assets/icons/check-circle.svg" alt="" width="64" height="64">
        <h3>Message Sent!</h3>
        <p>Thank you for reaching out. I'll get back to you soon.</p>
      </div>

      <!-- Form -->
      <form class="contact-form" *ngIf="formState() !== 'success'" (ngSubmit)="sendEmail()">
        <div class="form-group">
          <label for="name">Name *</label>
          <input
            type="text"
            id="name"
            [(ngModel)]="formData.name"
            name="name"
            placeholder="Your name"
            required
            [disabled]="formState() === 'sending'">
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="formData.email"
            name="email"
            placeholder="your.email@example.com"
            required
            [disabled]="formState() === 'sending'">
        </div>

        <div class="form-group">
          <label for="subject">Subject *</label>
          <input
            type="text"
            id="subject"
            [(ngModel)]="formData.subject"
            name="subject"
            placeholder="What's this about?"
            required
            [disabled]="formState() === 'sending'">
        </div>

        <div class="form-group">
          <label for="message">Message *</label>
          <textarea
            id="message"
            [(ngModel)]="formData.message"
            name="message"
            rows="6"
            placeholder="Your message..."
            required
            [disabled]="formState() === 'sending'"></textarea>
        </div>

        <!-- Error Message -->
        <div class="error-message" *ngIf="formState() === 'error' && errorMessage()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ errorMessage() }}
        </div>

        <div class="form-actions">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="closeForm()"
            [disabled]="formState() === 'sending'">
            Back
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="formState() === 'sending'">
            <span *ngIf="formState() !== 'sending'">Send Message</span>
            <span *ngIf="formState() === 'sending'">
              <span class="spinner"></span>
              Sending...
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
